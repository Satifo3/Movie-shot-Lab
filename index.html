<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c0f14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Movie shot Lab</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button id="brandBtn" class="brandBtn" aria-label="ホームへ">
        <span class="brandMark">MS</span>
        <span><span class="eyebrow">ANIMATION CINEMATOGRAPHY QUICK REF</span><strong>Movie shot Lab</strong></span>
      </button>
      <button id="homeBtn" class="iconBtn" aria-label="目次へ戻る">目次</button>
    </header>

    <main>
      <section id="tocView" class="view active">
        <div class="hero">
          <div class="heroTop">
            <div>
              <span class="kicker">PRIVATE REFERENCE</span>
              <h1>撮影用語を<br><em>最短1タップ</em>で確認。</h1>
              <p>撮影マニュアルの該当ページと、実際のアニメ作例GIFを同じ場所で参照できる早見ツール。</p>
            </div>
            <div class="heroBadge"><span id="termCount">0</span><small>項目</small></div>
          </div>

          <div class="searchWrap">
            <span class="searchIcon">⌕</span>
            <input id="searchInput" type="search" placeholder="PAN / 透過光 / ブラー / Follow…" autocomplete="off" />
            <button id="clearSearch" class="clearSearch" aria-label="検索を消去">×</button>
          </div>

          <div class="modeSwitch" role="tablist">
            <button class="modeBtn active" data-mode="manual">用語早見</button>
            <button class="modeBtn" data-mode="examples">作例GIF</button>
            <button class="modeBtn" data-mode="favorites">★ お気に入り</button>
          </div>
        </div>

        <div id="categoryChips" class="chips"></div>
        <div id="recentBlock" class="recentBlock"></div>
        <div id="tocList" class="tocList"></div>
      </section>

      <section id="pageView" class="view pageView">
        <div class="pageMeta">
          <div class="pageHeading">
            <span id="categoryLabel" class="badge"></span>
            <h2 id="itemTitle"></h2>
          </div>
          <button id="favoriteBtn" class="favoriteBtn" aria-label="お気に入り">☆</button>
        </div>

        <div class="detailTabs">
          <button class="detailTab active" data-detail="manual">マニュアル</button>
          <button id="exampleTab" class="detailTab" data-detail="example">作例GIF <span id="exampleCount"></span></button>
        </div>

        <div id="manualPanel" class="detailPanel active">
          <div class="pageCounterRow">
            <div id="pageCounter" class="pageCounter"></div>
            <button id="fitBtn" class="miniBtn">画像を拡大</button>
          </div>
          <div id="paperWrap" class="paperWrap">
            <img id="pageImage" alt="撮影マニュアル 該当ページ" />
          </div>
          <div class="pager">
            <button id="prevBtn">← 前ページ</button>
            <button id="tocBtn">目次に戻る</button>
            <button id="nextBtn">次ページ →</button>
          </div>
        </div>

        <div id="examplePanel" class="detailPanel">
          <div id="relatedExamples" class="exampleGrid"></div>
          <div id="noExample" class="empty hidden">この項目に紐づく作例GIFはまだ登録されていません。</div>
          <button id="tocBtn2" class="wideHome">目次に戻る</button>
        </div>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
